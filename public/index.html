<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Boutique</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- ===== Navbar ===== -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">🛒 API Boutique</span>
      <span class="text-light small">Node.js · Express · Sequelize · MySQL · Bootstrap</span>
    </div>
  </nav>

  <div class="container pb-5">

    <!-- ===== Zone de messages (succès / erreur) ===== -->
    <div id="zoneMessage"></div>

    <div class="row g-4">

      <!-- ===== Formulaire d'ajout / modification ===== -->
      <div class="col-12 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title" id="titreFormulaire">Ajouter un produit</h5>
            <form id="formProduit">
              <input type="hidden" id="produitId" value="">

              <div class="mb-3">
                <label class="form-label">Nom du produit</label>
                <input type="text" class="form-control" id="champNom" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" id="champDescription" rows="2"></textarea>
              </div>

              <div class="row">
                <div class="col-6 mb-3">
                  <label class="form-label">Prix (€)</label>
                  <input type="number" step="0.01" min="0" class="form-control" id="champPrix" required>
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label">Stock</label>
                  <input type="number" min="0" class="form-control" id="champStock" value="0">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Catégorie</label>
                <select class="form-select" id="champCategorie">
                  <option value="">— Aucune —</option>
                </select>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary w-100" id="boutonSubmit">Ajouter le produit</button>
                <button type="button" class="btn btn-outline-secondary d-none" id="boutonAnnuler">Annuler</button>
              </div>
            </form>
          </div>
        </div>

        <!-- ===== Filtre par catégorie ===== -->
        <div class="card shadow-sm mt-4">
          <div class="card-body">
            <h6 class="card-title">Filtrer par catégorie</h6>
            <select class="form-select" id="filtreCategorie">
              <option value="">Toutes les catégories</option>
            </select>
          </div>
        </div>
      </div>

      <!-- ===== Liste des produits ===== -->
      <div class="col-12 col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">Liste des produits</h5>
          <span class="badge bg-secondary" id="compteurProduits">0 produit</span>
        </div>
        <div id="chargement" class="text-center py-5 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Chargement...</span>
          </div>
        </div>
        <div class="row g-3" id="listeProduits"></div>
      </div>

    </div>
  </div>

  <!-- ===== Modale de confirmation de suppression ===== -->
  <div class="modal fade" id="modalSuppression" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirmer la suppression</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Voulez-vous vraiment supprimer <strong id="nomProduitASupprimer"></strong> ? Cette action est irréversible.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-danger" id="boutonConfirmerSuppression">Supprimer</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
